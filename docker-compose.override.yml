services:
  api:
    build:
      target: build
    volumes:
      - ./src:/src/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    entrypoint: ["dotnet", "watch", "--project", "src/WebApi", "run", "--urls", "http://+:8080"]
    ports:
      - "${API_PORT}:8080"

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "${FRONTEND_PORT}:5173"
